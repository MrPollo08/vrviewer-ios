name: Build IPA

# Compila la app en un runner macOS de GitHub y publica un .ipa sin firmar
# como artifact descargable. No hace falta tener un Mac.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15-intel
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Install CocoaPods
        run: |
          gem install cocoapods --user-install --no-document || sudo gem install cocoapods --no-document
          export PATH="$HOME/.gem/ruby/*/bin:$PATH"
          pod --version || true
          # Si el gem falla, usar el cocoapods que ya trae el runner
          which pod || echo "sin pod"

      - name: Pod install (MediaPipe)
        run: |
          export PATH="$HOME/.gem/ruby/*/bin:$PATH"
          (pod install --repo-update || pod install) || echo "POD_INSTALL_FALLO"
          ls -d VRViewer.xcworkspace 2>/dev/null && echo "WORKSPACE_OK" || echo "SIN_WORKSPACE"

      - name: Build (unsigned)
        run: |
          set -o pipefail
          if [ -d "VRViewer.xcworkspace" ]; then
            PROJECT_ARG="-workspace VRViewer.xcworkspace"
          else
            PROJECT_ARG="-project VRViewer.xcodeproj"
          fi
          xcodebuild \
            $PROJECT_ARG \
            -scheme VRViewer \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_BITCODE=NO \
            build | tee xcodebuild.log

      - name: Package IPA
        run: |
          APP_PATH="$(find build -maxdepth 5 -name 'VRViewer.app' -type d | head -n 1)"
          if [ -z "$APP_PATH" ]; then
            echo "No se generó la app. Últimas 200 líneas del log:"
            tail -n 200 xcodebuild.log
            exit 1
          fi
          echo "App compilada en: $APP_PATH"
          rm -rf Payload VRViewer.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r VRViewer.ipa Payload
          ls -lh VRViewer.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: VRViewer-ipa
          path: VRViewer.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore
